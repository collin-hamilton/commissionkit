[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commissionkit"
version = "0.1.0"
description = "guided industrial I/O checkout with portable evidence reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Collin Hamilton" }]

[project.scripts]
commissionkit = "commissionkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

